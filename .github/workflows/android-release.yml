name: android-release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_VERSION: "1.4.0"

permissions:
  contents: write

jobs:
  release:
    name: Build, test, and release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up release signing from secrets (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > local.properties <<EOF
          STORE_FILE=$GITHUB_WORKSPACE/release.keystore
          STORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APKs
        env:
          BUILD_NO: ${{ github.run_number }}
        run: >
          ./gradlew :app:assembleRelease --console=plain
          -PbuildVersionCode=$BUILD_NO
          "-PbuildVersionName=$APP_VERSION-b$BUILD_NO"

      - name: Rename APKs
        env:
          BUILD_NO: ${{ github.run_number }}
        run: |
          cd app/build/outputs/apk/release
          mv app-arm64-v8a-release.apk "Bluedrop-$APP_VERSION-b$BUILD_NO-arm64-v8a.apk"
          mv app-universal-release.apk "Bluedrop-$APP_VERSION-b$BUILD_NO-universal.apk"
          ls -la

      - name: Sign check
        id: sign
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "mode=release key from secrets" >> "$GITHUB_OUTPUT"
          else
            echo "mode=CI convenience key (keystores/ci.keystore) — fine for personal installs, do not distribute as official" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          BUILD_NO: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION-b$BUILD_NO"
          gh release create "$TAG" \
            --title "Bluedrop $APP_VERSION build $BUILD_NO (Android)" \
            --prerelease \
            --notes "Automated build from commit ${{ github.sha }}.

          Signing: ${{ steps.sign.outputs.mode }}

          - **Bluedrop-$APP_VERSION-b$BUILD_NO-arm64-v8a.apk** — for phones (arm64)
          - **Bluedrop-$APP_VERSION-b$BUILD_NO-universal.apk** — any device/emulator

          Note: the app contains no native code, so both APKs carry identical
          payload today; install the arm64 one on your phone." \
            app/build/outputs/apk/release/*.apk
